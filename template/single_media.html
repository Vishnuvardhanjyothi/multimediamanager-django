
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ obj.desc }}</title>
    <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    padding: 40px 20px;
}

.page-title {
    text-align: center;
    color: #222;
    margin-bottom: 30px;
}

.media-container {
    width: 100%;
    max-width: 700px;
    margin: auto;
}

.media-card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.1);
}

.media-image {
    width: 100%;
    height: 300px;
    display: block;
    object-fit: cover;
}

.media-content {
    padding: 25px;
}

.description {
    font-size: 20px;
    font-weight: bold;
    color: #333;
    margin-bottom: 25px;
}

.media-section {
    margin-bottom: 25px;
}

.media-title {
    font-size: 15px;
    font-weight: bold;
    color: #555;
    margin-bottom: 10px;
}

.media-card video {
    width: 100%;
    height: 300px;
    display: block;
    background: #000;
    border-radius: 8px;
    object-fit: contain;
}

.media-card audio {
    width: 100%;
    display: block;
}

.back-btn {
    display: block;
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    background: #4a90e2;
    color: white;
    text-align: center;
    text-decoration: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
}

.back-btn:hover {
    background: #357abd;
}
</style>
</head>

<body>

    <h1 class="page-title">Movie / Media</h1>

    <div class="media-container">

        <div class="media-card">

            {% if obj.image %}
                <img src="{{ obj.image.url }}"
                     alt="Movie Image"
                     class="media-image">
            {% endif %}


            <div class="media-content">

                <div class="description">
                    {{ obj.desc }}
                </div>


                {% if obj.video %}
                <div class="media-section">

                    <div class="media-title">
                        🎥 Video
                    </div>

                    <video controls>
                        <source src="{{ obj.video.url }}">
                        Your browser does not support video playback.
                    </video>

                </div>
                {% endif %}


                {% if obj.audio %}
                <div class="media-section">

                    <div class="media-title">
                        🎵 Audio
                    </div>

                    <audio controls>
                        <source src="{{ obj.audio.url }}">
                        Your browser does not support audio playback.
                    </audio>

                </div>
                {% endif %}


                <a href="{% url 'media' %}" class="update-btn">
                    ← Back to All Media
                </a>

            </div>

        </div>

    </div>

</body>
</html>
