
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Media</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .container {
            width: 500px;

            background: white;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;

            color: #222;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            font-weight: bold;

            color: #333;

            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 14px;
        }

        input[type="text"]:focus {
            outline: none;

            border-color: #4a90e2;
        }

        input[type="file"] {
            background: #f8f9fa;

            cursor: pointer;
        }

        .current {
            margin-top: 8px;

            font-size: 13px;

            color: #777;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #4a90e2;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background: #357abd;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #4a90e2;

            text-decoration: none;

            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>✏️ Update Media</h1>

        <p class="subtitle">
            Update your uploaded media
        </p>


        <form method="POST"
              enctype="multipart/form-data">

            {% csrf_token %}


            <!-- Description -->

            <div class="form-group">

                <label>
                    Description
                </label>

                <input type="text"
                       name="desc"
                       value="{{ obj.desc }}">

            </div>


            <!-- Image -->

            <div class="form-group">

                <label>
                    Image
                </label>

                <input type="file"
                       name="img"
                       accept="image/*">

                {% if obj.image %}

                <div class="current">
                    Current image: {{ obj.image.name }}
                </div>

                {% endif %}

            </div>


            <!-- Audio -->

            <div class="form-group">

                <label>
                    Audio
                </label>

                <input type="file"
                       name="audio"
                       accept="audio/*">

                {% if obj.audio %}

                <div class="current">
                    Current audio: {{ obj.audio.name }}
                </div>

                {% endif %}

            </div>


            <!-- Video -->

            <div class="form-group">

                <label>
                    Video
                </label>

                <input type="file"
                       name="vid"
                       accept="video/*">

                {% if obj.video %}

                <div class="current">
                    Current video: {{ obj.video.name }}
                </div>

                {% endif %}

            </div>


            <button type="submit">
                Update Media
            </button>

        </form>


        <a href="{% url 'media' %}"
           class="back">
            ← Back to Media Gallery
        </a>

    </div>

</body>

</html>
