<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Media</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    padding: 40px 20px;
}


/* PAGE TITLE */

.page-title {
    text-align: center;
    margin-bottom: 35px;
    color: #222;
}


/* MAIN CONTAINER */

.media-container {
    width: 100%;
    max-width: 700px;
    margin: auto;

    display: flex;
    flex-direction: column;
    gap: 30px;
}


/* ONE CARD FOR ONE DATABASE RECORD */

.media-card {
    width: 100%;
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.10);
}


/* IMAGE */

.media-image {
    width: 100%;
    height: 450px;
    display: block;
    object-fit: cover;
}


/* CONTENT INSIDE SAME CARD */

.media-content {
    padding: 25px;
}


/* DESCRIPTION */

.description {
    font-size: 20px;
    font-weight: bold;
    color: #333;
    margin-bottom: 25px;
}


/* VIDEO / AUDIO SECTION */

.media-section {
    margin-bottom: 25px;
}


/* MEDIA TITLE */

.media-title {
    font-size: 15px;
    font-weight: bold;
    color: #555;
    margin-bottom: 10px;
}


/* VIDEO */

.media-card video {
    width: 100%;
    height: 250px;
    display: block;
    background: #000;
    border-radius: 8px;
    object-fit: contain;
}


/* AUDIO */

.media-card audio {
    width: 100%;
    display: block;
}


/* UPDATE BUTTON */

.update-btn {
    display: block;
    width: 100%;

    padding: 13px;

    margin-top: 10px;

    background: #4a90e2;
    color: white;

    text-align: center;
    text-decoration: none;

    border-radius: 8px;

    font-size: 16px;
    font-weight: bold;
}


.update-btn:hover {
    background: #357abd;
}
.delete-btn {
    display: block;
    width: 100%;

    padding: 13px;

    margin-top: 10px;

    background: #e24a4a;
    color: white;

    text-align: center;
    text-decoration: none;

    border-radius: 8px;

    font-size: 16px;
    font-weight: bold;
}
.delete-btn:hover {
    background: #b22e2e;
}   


/* NO MEDIA */

.no-media {
    width: 100%;
    max-width: 700px;

    margin: auto;

    padding: 40px;

    background: white;

    border-radius: 15px;

    text-align: center;

    color: #777;

    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.10);
}
    </style>

</head>

<body>

    <h1 class="page-title">📁 Uploaded Media</h1>

    {% if obj1 %}

    <div class="media-container">

        {% for obj in obj1 %}

        <div class="media-card">

            <!-- IMAGE -->
            {% if obj.image %}
                <img src="{{ obj.image.url }}" alt="Uploaded Image" class="media-image">
            {% endif %}


            <div class="media-content">

                <!-- DESCRIPTION -->
                <div class="description">
                    {{ obj.desc }}
                </div>


                <!-- VIDEO -->
                {% if obj.video %}
                <div class="media-section">

                    <div class="media-title">
                        🎥 Video
                    </div>

                    <video controls>
                        <source src="{{ obj.video.url }}">
                        Your browser does not support video playback.
                    </video>

                </div>
                {% endif %}


                <!-- AUDIO -->
                {% if obj.audio %}
                <div class="media-section">

                    <div class="media-title">
                        🎵 Audio
                    </div>

                    <audio controls>
                        <source src="{{ obj.audio.url }}">
                        Your browser does not support audio playback.
                    </audio>

                </div>
                {% endif %}


                <!-- UPDATE BUTTON -->
                <a href="{% url 'update' obj.id %}" class="update-btn">
                    ✏️ Update
                </a>

                <a href="{% url 'delete' obj.id %}" class="delete-btn">
                    DELETE
                </a>

            </div>

        </div>

        {% endfor %}

    </div>

    {% else %}

        <div class="no-media">
            <p>No media files uploaded yet.</p>
        </div>

    {% endif %}

</body>
</html>
